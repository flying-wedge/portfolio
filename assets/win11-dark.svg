<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="w-bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#111c30" />
      <stop offset="55%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#05080e" />
    </radialGradient>
    <linearGradient id="petal1" x1="0%" y1="0%" x2="100%" y2="100%">
