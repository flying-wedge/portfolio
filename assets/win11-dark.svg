    <path d="M-120,40 C-180,-80 -40,-180 80,-140 C180,-100 180,60 100,140 C20,200 -80,140 -120,40 Z" fill="url(#petal3)" opacity="0.95" />
    <path d="M-60,-80 C20,-160 140,-120 120,-20 C100,80 -20,100 -60,20 C-90,-40 -80,-60 -60,-80 Z" fill="url(#petal2)" />
